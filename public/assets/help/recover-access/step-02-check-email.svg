<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Email inbox with reset message">
  <rect width="640" height="400" fill="#f4f4f4"/>
  <rect x="80" y="50" width="480" height="300" rx="8" fill="#fff" stroke="#ddd"/>
  <text x="110" y="95" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#333">Inbox</text>
  <rect x="110" y="115" width="420" height="52" rx="6" fill="#fff8f6" stroke="#f0d8d3"/>
  <text x="125" y="140" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#1a110a">Reset your WWM password</text>
  <text x="125" y="158" font-family="Arial,sans-serif" font-size="11" fill="#6e6e6e">robot@worldwatercolormasters.art</text>
  <rect x="110" y="180" width="420" height="44" rx="6" fill="#fafafa" stroke="#eee"/>
