<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Password reset email with link">
  <rect width="640" height="400" fill="#faf6f0"/>
  <rect x="100" y="30" width="440" height="340" rx="10" fill="#fff" stroke="#e5e5e5"/>
  <text x="140" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1a110a">Reset your WWM password</text>
  <text x="140" y="115" font-family="Arial,sans-serif" font-size="13" fill="#444">Open this link to set a new password (valid 1 hour):</text>
  <rect x="140" y="135" width="360" height="36" rx="6" fill="#faf6f0" stroke="#e5e5e5"/>
  <text x="150" y="158" font-family="Arial,sans-serif" font-size="11" fill="#b81e16">my.worldwatercolormasters.art/reset?token=…</text>
  <rect x="140" y="200" width="180" height="38" rx="8" fill="#e63027"/>
  <text x="195" y="224" font-family="Arial,sans-serif" font-size="13" fill="#fff">Reset password</text>
</svg>
