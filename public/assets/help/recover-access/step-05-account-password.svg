<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Account page change password">
  <rect width="640" height="400" fill="#faf6f0"/>
  <rect x="60" y="40" width="520" height="320" rx="12" fill="#fff" stroke="#e5e5e5"/>
  <text x="100" y="90" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1a110a">Account</text>
  <text x="100" y="130" font-family="Arial,sans-serif" font-size="14" fill="#444">Change password while signed in</text>
  <rect x="100" y="160" width="440" height="120" rx="8" fill="#faf6f0" stroke="#e5e5e5"/>
  <text x="120" y="195" font-family="Arial,sans-serif" font-size="12" fill="#6e6e6e">Current password</text>
  <rect x="120" y="205" width="280" height="32" rx="6" fill="#fff" stroke="#d0d0d0"/>
