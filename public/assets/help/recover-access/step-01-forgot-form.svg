<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Reset password form">
  <rect width="640" height="400" fill="#faf6f0"/>
  <rect x="120" y="40" width="400" height="320" rx="12" fill="#fff" stroke="#e5e5e5"/>
  <text x="170" y="95" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1a110a">Reset password</text>
  <text x="170" y="130" font-family="Arial,sans-serif" font-size="14" fill="#6e6e6e">Enter your email and we will send a reset link.</text>
  <text x="170" y="175" font-family="Arial,sans-serif" font-size="12" fill="#6e6e6e">Email</text>
  <rect x="170" y="185" width="300" height="36" rx="6" fill="#fff" stroke="#d0d0d0"/>
  <rect x="170" y="245" width="300" height="40" rx="8" fill="#e63027"/>
  <text x="270" y="270" font-family="Arial,sans-serif" font-size="14" fill="#fff">Send link</text>
</svg>
