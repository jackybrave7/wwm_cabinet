<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <title>Sign in — WWM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Fraunces:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/prototype.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand wwm-logo" href="index.html">World Watercolor <em>Masters</em></a>
    </div>
  </header>

  <main class="site-main">
    <section class="auth-card">
      <h1 class="page-title page-title-sm">Sign in</h1>
      <p class="lede">Access your video courses at my.worldwatercolormasters.art</p>
      <form class="form" action="dashboard.html">
        <label class="field">
          <span>Email</span>
          <input type="email" value="student@example.com" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" value="password" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
      <p style="margin-top:16px;font-size:0.9rem;color:var(--mute)"><a href="#">Forgot password?</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap"><p><a href="index.html">← Prototype index</a></p></div>
  </footer>
</body>
</html>
